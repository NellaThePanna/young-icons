  .logo .mark{width:30px;height:34px;background:var(--black);clip-path:polygon(50% 0,100% 22%,100% 74%,50% 100%,0 74%,0 22%);}
  .logo b{font-family:'Anton';font-size:17px;color:var(--black);display:block;line-height:1;}
  .logo span{font-size:8px;letter-spacing:.26em;color:var(--ink);}
  .burger i{display:block;width:26px;height:2px;background:var(--black);margin:5px 0;}
  .hero-svg{display:block;width:100%;height:auto;}
  .panel{background:#fff;border:1px solid #ddd;border-radius:10px;padding:16px 20px;margin-top:16px;display:grid;grid-template-columns:1fr 1fr;gap:14px 30px;}
  .ctl{display:flex;align-items:center;gap:12px;}
  .ctl label{font-size:12px;font-weight:600;color:#333;min-width:132px;}
  .ctl input[type=range]{flex:1;accent-color:var(--green);}
  .ctl output{font-size:12px;color:var(--green);min-width:40px;text-align:right;font-weight:600;}
  .vals{grid-column:1/3;margin-top:6px;font-size:12px;color:#666;border-top:1px solid #eee;padding-top:10px;}
  .vals b{color:var(--green);}
</style></head>

<script>
function $(id){return document.getElementById(id);}
function upd(){
  var size=+$('size').value, gap=+$('gap').value, mx=+$('mx').value, pw=+$('pw').value, px=+$('px').value, pan=+$('pan').value;
  $('sizeO').value=size;$('gapO').value=gap;$('mxO').value=mx;$('pwO').value=pw;$('pxO').value=px;$('panO').value=pan;
  var yH=356, yC=yH+gap;
  $('holiday').setAttribute('font-size',size);$('holiday').setAttribute('x',mx);$('holiday').setAttribute('y',yH);
  $('campsMask').setAttribute('font-size',size);$('campsMask').setAttribute('x',mx);$('campsMask').setAttribute('y',yC);
  $('rbRect').setAttribute('x',px);$('rbRect').setAttribute('width',pw);
  $('rightImg').setAttribute('x',px);$('rightImg').setAttribute('width',pw);
  // pan: xMin..xMax slice bias
  var ar = pan<34?'xMinYMid':(pan>66?'xMaxYMid':'xMidYMid');
  $('rightImg').setAttribute('preserveAspectRatio',ar+' slice');
  $('vals').innerHTML='Current values &mdash; type <b>'+size+'</b>, gap <b>'+gap+'</b>, margin <b>'+mx+'</b>, photo w <b>'+pw+'</b>, photo x <b>'+px+'</b>, pan <b>'+ar+'</b>. Tell me these numbers and I lock them into the coded page.';
}
['size','gap','mx','pw','px','pan'].forEach(function(id){$(id).addEventListener('input',upd);});
upd();
</script>

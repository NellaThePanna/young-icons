<!DOCTYPE html>
<!-- APPROVED 2026-07-28 — client-confirmed final placement/sizing for the Schools Overview
     Enquiry/CTA section (light version, replaces the old dark SchoolsFinalCTA + SchoolEnquiryForm).
     Source: client-dragged snapshot of schools-enquiry-cta-editor.html, saved as
     "REAL CONTENT - CTA.html" and uploaded 2026-07-28. Box coordinates below are the exact,
     approved values — do not alter without new client sign-off. -->
<html lang="en"><head><meta http-equiv="Content-Type" content="text/html; charset=UTF-8">

<title>Schools — Enquiry CTA editor (light, real content) — APPROVED</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Anton&family=Inter:wght@400;500;700&display=swap');

:root{
  --color-black:#000000;
  --color-white:#ffffff;
  --color-academy-green:#1a7a47;
  --color-warm-off-white:#f5f5f2;
  --color-near-black:#0c0e0c;
  --font-display:'Anton', sans-serif;
  --font-body:'Inter', sans-serif;
  --radius-lg:16px;
}
*{box-sizing:border-box;}
body{margin:0;font-family:var(--font-body);background:#3a3a3a;color:#111;}

.stage-wrap{padding:40px;display:flex;justify-content:center;}
.stage{
  position:relative;width:1440px;background:var(--color-white);
  box-shadow:0 20px 60px rgba(0,0,0,.4);
  border-top:4px solid var(--color-academy-green);
  overflow:visible;
}

.box{position:absolute;}

.eyebrow-heading{
  font-family:var(--font-display);
  text-transform:uppercase;
  line-height:1.02;
  font-size:44px;
}
.eyebrow-heading .black{color:var(--color-black);}
.eyebrow-heading .green{color:var(--color-academy-green);}

.cta-body{
  font-family:var(--font-body);
  font-size:15px;
  line-height:1.55;
  color:rgba(0,0,0,.68);
}

.btn-row{display:flex;gap:12px;}
.btn-primary{
  font-family:var(--font-body);font-weight:700;font-size:12px;letter-spacing:.05em;
  text-transform:uppercase;color:#fff;background:var(--color-academy-green);
  padding:13px 22px;border-radius:8px;white-space:nowrap;display:inline-flex;
  align-items:center;justify-content:center;
}
.btn-secondary{
  font-family:var(--font-body);font-weight:700;font-size:12px;letter-spacing:.05em;
  text-transform:uppercase;color:var(--color-near-black);background:transparent;
  border:1.5px solid rgba(0,0,0,.25);padding:11.5px 20px;border-radius:8px;
  white-space:nowrap;display:inline-flex;align-items:center;gap:6px;justify-content:center;
}

.field-label{
  font-family:var(--font-body);font-size:11px;color:rgba(0,0,0,.5);
  margin-bottom:4px;display:block;
}
.field-input{
  width:100%;border:none;border-bottom:1px solid rgba(0,0,0,.18);
  background:transparent;font-family:var(--font-body);font-size:14px;
  padding:4px 2px 8px;color:#111;
}
.field-col{display:flex;flex-direction:column;}

.send-link{
  font-family:var(--font-body);font-weight:700;font-size:12px;letter-spacing:.05em;
  text-transform:uppercase;color:var(--color-academy-green);display:inline-flex;
  align-items:center;gap:6px;
}
</style>
</head>
<body>

<div class="stage-wrap">
  <div class="stage" id="stage">

    <!-- LEFT: heading — APPROVED: left 88px, top 74px, width 390px, height 113px -->
    <div class="box" data-k="heading" style="left: 88px; top: 74px; width: 390px; height: 113px;">
      <div class="eyebrow-heading">
        <span class="black">LET'S BUILD YOUR</span><br>
        <span class="green">PROGRAMME.</span>
      </div>
    </div>

    <!-- LEFT: body — APPROVED: left 89px, top 221px, width 389px, height 74px -->
    <div class="box" data-k="body" style="left: 89px; top: 221px; width: 389px; height: 74px;">
      <p class="cta-body" style="margin:0;">Let's work together to create an activity programme that supports your school, your staff and your students.</p>
    </div>

    <!-- LEFT: buttons — APPROVED: left 86px, top 330px, width 395px, height 51px -->
    <div class="box" data-k="buttons" style="left: 86px; top: 330px; width: 395px; height: 51px;">
      <div class="btn-row">
        <span class="btn-primary">Book a Meeting</span>
        <span class="btn-secondary">💬 WhatsApp Us</span>
      </div>
    </div>

    <!-- RIGHT: form panel — APPROVED: left 589px, top 73px, width 759px, height 311px -->
    <div class="box" data-k="form" style="left: 589px; top: 73px; width: 759px; height: 311px;">
      <div style="display:grid;grid-template-columns:1fr 1fr;gap:24px 32px;">
        <div class="field-col">
          <label class="field-label">Full Name*</label>
          <input class="field-input" placeholder="">
        </div>
        <div class="field-col">
          <label class="field-label">School Name*</label>
          <input class="field-input" placeholder="">
        </div>
        <div class="field-col">
          <label class="field-label">Email Address*</label>
          <input class="field-input" placeholder="">
        </div>
        <div class="field-col">
          <label class="field-label">Phone Number*</label>
          <input class="field-input" placeholder="">
        </div>
        <div class="field-col" style="grid-column:1 / -1;">
          <label class="field-label">Message*</label>
          <input class="field-input" placeholder="" style="padding-bottom:24px;">
        </div>
        <div style="grid-column:1 / -1;margin-top:4px;">
          <span class="send-link">Send Message →</span>
        </div>
      </div>
    </div>

  </div>
</div>

</body></html>
